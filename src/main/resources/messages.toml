# BSP-Velocity Additions: every line a player can see.
# MiniMessage format (https://docs.advntr.dev/minimessage/format.html), for example "<yellow>text" or "<gray>[<green>+<gray>]".
# Placeholders: <player> the player's name, <server> the server joined or left from.
# <server_tag> (in chat.relay, chat.relayStaff and players.staffServer): the server's image from BSP-Server Utilities,
# or the grey [BSP-Spawn] text where a server has no image; the hover is chat.serverTagHover.

[joinLeave]
join = "<yellow><player> joined the game"
leave = "<yellow><player> left the game"

[tabList]
# <online> players on the network, <ping> the viewer's own ping in ms, <newline> for a second line.
header = "Build | Secure | Protect<newline><gray>minecraft.buildsecureprotect.com"
footer = "<gray><online> online · ping <white><ping> ms"
# A name, used only where the player's own server gives none (with BSP-RankUp's prefix display on, RankUp's name shows
# instead, images and suffixes included). <prefix> is the LuckPerms prefix (empty without LuckPerms-Velocity), <staff>
# the mark below for staff. /players always uses this line.
entry = "<prefix><staff><player>"
staffMark = ""

[players]
# <online> the count, <names> the names (each rendered with tabList.entry), <servers> how many servers have players.
# staffServer also takes <server_tag> (see the top of this file).
list = "<yellow>Online (<online>):</yellow> <names>"
none = "<gray>Nobody is online."
staffHeader = "<yellow>Online (<online>)</yellow> <gray>on <servers> server(s)"
staffServer = "<gray><server> (<count>):</gray> <names>"
separator = "<white>, "

[chat]
# A chat line from another server. <line> is the line as the backend showed it, <player> and <text> its parts,
# <server> the server it came from. Everyone sees "relay"; players with players.serversPermission see "relayStaff".
relay = "<line>"
relayStaff = "<server_tag> <line>"
# Hovering a <server_tag>. <server> the server's name.
serverTagHover = "<white><server>"

[chatHistory]
# Around the recent chat a player gets when joining the network; each line in between uses chat.relay (or relayStaff).
# Leave one empty to send no line there.
header = "<gray>─── Earlier chat ───"
footer = "<gray>─── Now ───"

[discord]
# The BSP Discord bot (Herald). Discord markdown, not MiniMessage: **bold**, *italic*. Every name and server put in
# is escaped, so it shows exactly as written and can never mention anyone.
# Each message has a ...Text line (what a phone notification shows) and a card: ...Title and ...Description.
# Leave both card lines empty to send the text alone. Placeholders are listed per message.
#
# Steal warning DM, BSP-Core's look A. <server>, <x> <y> <z>, <thief>, <seconds>.
warningText = "Your totem on <server> is being stolen!"
warningTitle = "⚠ Totem under attack"
warningDescription = ""
warningServer = "Server"
warningServerValue = "<server>"
warningWhere = "Where"
warningWhereValue = "<x> <y> <z>"
warningThief = "Thief"
warningThiefValue = "<thief>"
warningTimeLeft = "Time left"
warningTimeLeftValue = "<seconds> seconds"
warningFooter = "Log in and stand by your totem to stop the steal."
# Outcome DMs. <server>, <x> <y> <z>, <thief>. The saved card's description depends on why the steal stopped.
savedText = "Your totem on <server> is safe."
savedTitle = "✔ Steal failed"
savedLeft = "<thief> left the totem for too long."
savedInterrupted = "<thief> left the game or could not go on."
savedTotemGone = "The totem was taken down, so the steal stopped."
savedCancelled = "An operator stopped the steal."
savedEnded = "The steal ended."
stolenText = "Your totem on <server> was stolen."
stolenTitle = "✖ Totem stolen"
stolenDescription = "<thief> now owns your totem at <x> <y> <z> on <server>."
# The public line in discord.alertChannelId. Only <server> exists here: the line never names anyone or anything else.
channelText = ""
channelTitle = ""
channelDescription = "A totem is being stolen on **<server>**"
# Answers to /link, /unlink and /linkstatus, look A (D24); only the player who typed the command sees them.
# <name> a Minecraft name. /unlink always needs a name (D25); without one the player sees the status list.
linkedText = ""
linkedTitle = "Linked"
linkedDescription = "Steal warnings for **<name>** will come to your DMs. A test message is on its way."
linkInvalidText = ""
linkInvalidTitle = "Code not accepted"
linkInvalidDescription = "That code is not valid or has run out. Type **/bsp discord link** in game for a new one."
tooManyTriesText = ""
tooManyTriesTitle = "Too many wrong codes"
tooManyTriesDescription = "Wait ten minutes, then type **/bsp discord link** in game for a new code."
unavailableText = ""
unavailableTitle = "Try again soon"
unavailableDescription = "The game network is not answering right now. Your code still works for a few minutes."
# <names> "A and B"; <list> one "• name" line each.
unlinkedText = ""
unlinkedTitle = "Unlinked"
unlinkedDescription = "Steal warnings for **<names>** will no longer come here."
unlinkNoMatchText = ""
unlinkNoMatchTitle = "Not found"
unlinkNoMatchDescription = "None of your linked accounts is called **<name>**. Type **/linkstatus** to see them."
statusText = ""
statusTitle = "Linked accounts"
statusDescription = "<list>"
statusFooter = "/unlink and a name to remove one"
notLinkedText = ""
notLinkedTitle = "Not linked"
notLinkedDescription = "No Minecraft account is linked to you. Type **/bsp discord link** in game to start."
# Direct messages after /link: the test to the new account, and a note to the account that used to get the warnings.
testText = "Herald test: steal warnings for <name> will arrive here."
testTitle = "✔ Herald test"
testDescription = "This is where your totem will call you when it is being stolen."
replacedText = "Steal warnings for <name> now go to another Discord account."
replacedTitle = ""
replacedDescription = ""

[store]
# /store (the Fourthwall store, SH-R1). [email] and [order] are written with square brackets because a word in
# angle brackets is a MiniMessage tag. <shop_link> is shopLinkText, clickable, opening store.toml's shopUrl.
help = "<gold>BSP Store</gold> <gray>- <shop_link><newline><yellow>/store link [email]</yellow> <gray>connect the email you shop with to this account<newline><yellow>/store claim [order] [email]</yellow> <gray>claim an order bought without your Minecraft name<newline><yellow>/store status</yellow> <gray>your orders and rewards"
shopLinkText = "<aqua><u>open the shop</u></aqua>"
usage = "<red>Use /store, /store link [email], /store claim [order] [email] or /store status."
playersOnly = "<red>Only players can use this."
unavailable = "<red>The store is not available right now. Please try again in a few minutes."
tooManyTries = "<red>Too many failed tries. Please wait ten minutes and try again."
linked = "<green>Linked <white><email></white> to your account.</green> <gray><orders> waiting order(s) and <memberships> membership(s) found."
alreadyLinked = "<red>Your account is already linked to <white><email></white>. Ask staff if that needs changing."
linkFailed = "<red>That email could not be linked. Use the email you bought with, exactly as at checkout."
claimed = "<green>Order <white><order></white> is yours. Your rewards are on their way."
alreadyClaimed = "<red>Order <white><order></white> has already been claimed."
claimCancelled = "<red>Order <white><order></white> was cancelled."
claimFailed = "<red>No order matches that order number and email."
statusHeader = "<gold>Your store orders and rewards"
statusNone = "<gray>Nothing yet. Bought something without your Minecraft name? Use <yellow>/store claim [order] [email]</yellow>."
statusOrder = "<gray>Order <white><order></white>: <state>"
statusReward = "<gray>  <white><reward></white><action>: <status>"

[storeAdmin]
# /storeadmin (permission bsp.shop.admin). Emails are always shown masked.
usage = "<red>Use /storeadmin lookup [player|order|email], assign [order] [player], unlink [player], revoke [order], grant [player] [reward], resync or reload."
lookupNothing = "<gray>Nothing found for <white><query></white>."
lookupLink = "<gray>Link: <white><player></white> = <white><email></white> (by <by>)"
lookupOrder = "<gray>Order <white><order></white>: <state><test>, <white><player></white>, <email>"
lookupMember = "<gray>Member <white><member></white>: <type>, tier <tier>, rewards applied: <granted>, <email>"
lookupReward = "<gray>  #<id> <white><reward></white> <action> for <player>: <status> (<target>)<claimed>"
unknownPlayer = "<red>No Minecraft Java account is named <white><player></white>."
assigned = "<green>Order <white><order></white> assigned to <white><player></white>; its rewards are written."
assignFailed = "<red>No order <white><order></white>."
assignNotWaiting = "<red>Order <white><order></white> is not waiting for a player (<state>)."
assignUnavailable = "<red>The contents of order <white><order></white> could not be found; try /storeadmin resync first."
unlinked = "<green>Unlinked <white><player></white> from <email>.</green> <gray><revoked> membership(s) taken back."
revoked = "<green>Order <white><order></white> taken back:</green> <gray><cancelled> waiting reward(s) cancelled, <revoked> take-back(s) written<waiting><lost>."
notLinked = "<red><white><player></white> has no store link."
granted = "<green>Granted <white><reward></white> to <white><player></white>."
unknownReward = "<red>No reward <white><reward></white> in store-rewards.toml."
resyncStarted = "<gray>Resync with Fourthwall started; the result follows."
resyncDone = "<green><summary>"
resyncFailed = "<red>Resync failed: <reason>"
reloaded = "<green>Store config reloaded: <products> product(s), <memberships> membership tier(s)<problems>."
reloadFailed = "<red>Reload failed; the old config stays: <reason>"
staffWarning = "<red>[Store]</red> <yellow><text>"

[seasonReset]
# The disconnect screen every player sees when BSP-Core's /bsp season reset reaches the proxy. The same words and
# colour as BSP-Core's own kick, so a player sees one screen whichever arrives first. <season> is the season that is
# starting, sent by BSP-Core; kickNoNumber is only for a BSP-Core too old to send it.
kick = "<gold>Season <season> has begun! Everyone starts over. Log in again to get your fresh Shatter Totem."
kickNoNumber = "<gold>A new season has begun! Everyone starts over. Log in again to get your fresh Shatter Totem."
