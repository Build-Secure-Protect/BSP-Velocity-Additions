# BSP-Velocity Additions configuration.
# Lines starting with # are comments. Server names must match the [servers] table in velocity.toml.

[lastServer]
# Send players back to the server they were on when they left the network.
enabled = true
# Servers that are never remembered. A player who left from one of these starts at spawn next time.
ignoredServers = []
# Where a player goes when their last server is offline or unknown.
# Empty means the first reachable server of the "try" list in velocity.toml.
fallbackServer = ""
# How often, in seconds, every server is pinged to learn whether it is reachable.
pingSeconds = 10
# Import VelocityRememberServer's plugins/velocityrememberserver/locations.yml once, when this plugin's own store is empty.
importVelocityRememberServer = true

[joinLeave]
# Announce to the whole network when a player really joins or leaves it.
# Switching servers never prints anything: a move line would let players track each other (owner decision D15).
enabled = true
# Players with this permission join, move and leave without a line. Empty disables the check.
silentPermission = "bspva.joinleave.silent"

[tabList]
# Show everyone on the network in everyone's tab list. Nothing shows which server a player is on.
enabled = true
# How often, in seconds, the footer and the names are refreshed.
refreshSeconds = 3
# Players with this permission get the staff mark from messages.toml in front of their name. Empty disables it.
staffPermission = "bspva.tab.staff"

[players]
# The /players command (alias /online): names only for everyone.
enabled = true
# Players with this permission see the list grouped by server, with counts.
serversPermission = "bspva.players.servers"

[chat]
# Shared chat: forward each public chat line BSP-Core sends on bsp_core:proxy to players on the other servers.
# Needs proxy.relayChat = true in BSP-Core's server config on every backend.
enabled = true
# Show the line as the backend formatted it (keeps colours and prefixes). Off: a plain "<Name> text".
useBackendFormatting = true
# Also print relayed lines to the proxy console.
logToConsole = true

[discord]
# The BSP Discord bot: Herald steal warnings by direct message, the public "A totem is being stolen on <server>" line,
# and /link, /unlink and /linkstatus in the BSP Discord. Off by default; the setup guide is docs/DISCORD.md.
# The bot's token is never written here: it is read only from the environment variable BSP_DISCORD_TOKEN on this
# machine. Without it the bot stays off.
enabled = false
# The BSP Discord server's id and the id of the channel for the public line. Turn on Developer Mode in Discord,
# right-click the server or the channel, "Copy ID". Keep the quotes. An empty alertChannelId sends no public line.
guildId = ""
alertChannelId = ""
# Redis, where BSP-Core sends the alerts and the link codes. The password is never written here: it is read only
# from the environment variable BSP_REDIS_PASSWORD. redisUser is the Redis ACL user; empty means the default user.
redisHost = "127.0.0.1"
redisPort = 6379
redisUser = ""
# Must equal discord.redisChannel in BSP-Core's server config on every backend.
redisChannel = "bsp_core:discord"
# How many wrong codes one Discord user may type into /link in ten minutes before /link waits. 0 means no limit.
wrongCodesPerTenMinutes = 5

[journeyMap]
# JourneyMap world ids. Behind the proxy every server has the same address, so the JourneyMap client can tell the
# servers apart only by a world id. With this on, the proxy is the only source of it: it answers the client's
# request on worldinfo:world_id with the id of the server the player is on, never forwards the request, drops any
# reply a server sends, and sends the id again after every server switch (only to clients that have asked once).
# Clients without JourneyMap never get anything. Each server's id comes from its velocity.toml name and never
# changes; set one in [journeyMap.worldIds] to keep an id a server already uses.
enabled = true
# Log every worldinfo:world_id message: direction, player, server, the bytes in hex and the id.
debug = false
# For a test session: log the channels each client registers (shows any other JourneyMap channel) and the name,
# direction and size of every plugin message on the channels this proxy listens to. Velocity shows plugins no others.
debugAllChannels = false
# How long after a server switch the id is sent again, in milliseconds (0 to 60000).
switchResendDelayMs = 1500

[journeyMap.worldIds]
# Server name = id. Letters, digits, - and _ only, at most 64 characters. Example:
# "BSP-Spawn" = "cc7a1dc1-1f9f-4922-83e4-cb353ca585cd"
